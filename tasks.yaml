# Task store: the structured source the dashboard reads (dashboard/build-data.mjs)
# and the janitor checks for past deadlines (scripts/brain-janitor.mjs).
# Claude maintains it through /goal and /dashboard ("mark the website task 70%");
# editing by hand is fine too.
#
# Format: a flat list, one "- title:" line starts a task, scalar fields only.
# Keep values on one line and avoid a colon inside a value (quote it if you must).
#
#   title:     what the task is (required)
#   area:      the project it belongs to: a folder name under brain/projects/,
#              or "aios" for work on this system itself
#   status:    todo | in-progress | blocked | done
#   progress:  0-100
#   deadline:  YYYY-MM-DD (leave the line out when there is none)
#   priority:  1 (highest) to 5
#   note:      one line of context (optional)
#   example:   true only on the placeholder tasks below; /setup deletes them
#
# Done tasks can stay for a while as a record; /janitor clears old ones.

- title: Example task, replace me with a real one
  area: aios
  status: in-progress
  progress: 40
  deadline: 2099-01-15
  priority: 2
  note: Placeholder so the dashboard has something to show before /setup
  example: true

- title: Example task without a deadline
  area: aios
  status: todo
  progress: 0
  priority: 4
  note: Placeholder, deleted by /setup
  example: true
