name: Outreach monitor

# The daily check on mail the outreach pack sent: replies, bounces, an automatic
# pause on a spam or reputation signal, a digest e-mail when there is news, and
# a heartbeat file that proves the check ran. It never sends outreach; sending
# is send-file.yml. Deterministic Python, no AI model, no paid service.
#
# Times are UTC: 07:05 UTC every day. Change the cron line to suit you.

on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch:

concurrency:
  group: outreach-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Scan replies and bounces
        working-directory: scripts/outreach
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python run.py

      - name: Commit heartbeat and pause flag
        # always(): a FAILED run still commits its heartbeat, which is how you
        # tell "broken" (status: error) from "not running" (stale last_run).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/outreach/heartbeat.md scripts/outreach/outreach.config.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: outreach monitor $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase -X theirs --autostash origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
